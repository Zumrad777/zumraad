<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <header>
    <span class="menu-btn" onclick="openSidebar()">☰</span>
    <h1>My Profile</h1>
  </header>

  <section class="profile-section">
  <h2>Welcome, Kitty Lover 🐾</h2>
  <p><strong>Username:</strong> <span id="display-username">cat_lover_123</span></p>
  <p><strong>Email:</strong> <span id="display-email">example@mail.com</span></p>
  <p><strong>Member since:</strong> January 2024</p>
</section>

<script>
  // Загружаем данные из localStorage
  window.onload = () => {
    if(localStorage.getItem("username")) {
      document.getElementById("display-username").textContent = localStorage.getItem("username");
    }
    if(localStorage.getItem("email")) {
      document.getElementById("display-email").textContent = localStorage.getItem("email");
    }
  };
</script>
